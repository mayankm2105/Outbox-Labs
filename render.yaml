services:
  - type: web
    name: reachinbox-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: npm run start:all
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-postgres
          property: connectionString
      - key: REDIS_HOST
        value: localhost
      - key: REDIS_PORT
        value: 6379
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_TTL_SECONDS
        value: 86400
      - key: GOOGLE_CLIENT_ID
        value: mock-google-client-id
      - key: GOOGLE_CLIENT_SECRET
        value: mock-google-client-secret
      - key: GOOGLE_CALLBACK_URL
        value: https://reachinbox-api.onrender.com/api/v1/auth/google/callback
      - key: ETHEREAL_HOST
        value: smtp.ethereal.email
      - key: ETHEREAL_PORT
        value: 587
      - key: ETHEREAL_USER
        value: mock-ethereal-user
      - key: ETHEREAL_PASSWORD
        value: mock-ethereal-password

databases:
  - name: reachinbox-postgres
    plan: free
